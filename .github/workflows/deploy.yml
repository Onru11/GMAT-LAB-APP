name: Deploy to GitHub Pages

# Tests and builds the app, then publishes it to the gh-pages branch, which
# GitHub Pages serves at https://<owner>.github.io/<repo>/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          git fetch --depth=1 origin gh-pages
          git worktree add /tmp/site FETCH_HEAD
          rsync -a --delete --exclude .git dist/ /tmp/site/
          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
